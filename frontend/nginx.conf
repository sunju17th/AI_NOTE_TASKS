server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Kích hoạt nén Gzip để tăng tốc độ tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cấu hình Single Page Application (SPA): mọi route chưa tồn tại đều dẫn về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh (JS, CSS, hình ảnh) trong 1 năm
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Không cache index.html để người dùng luôn nhận bản cập nhật mới nhất
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
